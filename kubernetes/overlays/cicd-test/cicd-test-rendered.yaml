apiVersion: v1
kind: Namespace
metadata:
  name: cicd-test
---
apiVersion: v1
data:
  DB_HOST: mysql-service
  DB_NAME: ecomdb
  FEATURE_DARK_MODE: "false"
kind: ConfigMap
metadata:
  name: app-config
  namespace: cicd-test
---
apiVersion: v1
data:
  db-load-script.sql: |
    CREATE DATABASE IF NOT EXISTS ecomdb;
        USE ecomdb;

        CREATE TABLE IF NOT EXISTS Products (
        id MEDIUMINT(8) UNSIGNED NOT NULL AUTO_INCREMENT,
        Name VARCHAR(255) DEFAULT NULL,
        Price VARCHAR(255) DEFAULT NULL,
        ImageUrl VARCHAR(255) DEFAULT NULL,
        PRIMARY KEY (id),
        UNIQUE KEY uq_products_name_imageurl (Name, ImageUrl)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

        INSERT INTO Products (Name, Price, ImageUrl)
        VALUES
        ('Laptop', '100', 'c-1.png'),
        ('Drone', '200', 'c-2.png'),
        ('VR', '300', 'c-3.png'),
        ('Tablet', '50', 'c-5.png'),
        ('Watch', '90', 'c-6.png'),
        ('Phone Covers', '20', 'c-7.png'),
        ('Phone', '80', 'c-8.png'),
        ('Laptop', '150', 'c-4.png')
        ON DUPLICATE KEY UPDATE
        Price = VALUES(Price),
        ImageUrl = VALUES(ImageUrl);
kind: ConfigMap
metadata:
  name: db-init-cm
  namespace: cicd-test
---
apiVersion: v1
data:
  password: ZWNvbXBhc3N3b3Jk
  rootpassword: ZWNvbXJvb3RwYXNzd29yZA==
  username: ZWNvbXVzZXI=
kind: Secret
metadata:
  creationTimestamp: "2026-07-02T18:20:33Z"
  name: db-credentials
  namespace: cicd-test
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: ecom-webapp
  name: ecom-web-svc
  namespace: cicd-test
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: ecom-webapp
  type: LoadBalancer
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mysql
  name: mysql-service
  namespace: cicd-test
spec:
  ports:
  - port: 3306
    protocol: TCP
    targetPort: 3306
  selector:
    app: mysql
status:
  loadBalancer: {}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cicd-test-mysql-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /mnt/data/cicd-test-mysql
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cicd-test-mysql-pvc
  namespace: cicd-test
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: manual
  volumeName: cicd-test-mysql-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ecom-webapp
  name: ecom-webapp
  namespace: cicd-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-webapp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ecom-webapp
    spec:
      containers:
      - env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: app-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: app-config
        - name: FEATURE_DARK_MODE
          valueFrom:
            configMapKeyRef:
              key: FEATURE_DARK_MODE
              name: app-config
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: rootpassword
              name: db-credentials
        image: testyoc/ecom-web-cicd-test:v1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz.php
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: ecom-webapp
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /readyz.php
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysql
  name: mysql
  namespace: cicd-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy: {}
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - env:
        - name: MYSQL_DATABASE
          value: ecomdb
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db-credentials
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: rootpassword
              name: db-credentials
        image: mariadb:10.5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: mariadb
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources: {}
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: mysql-persistent-storage
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: cicd-test-mysql-pvc
status: {}
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: ecom-webapp-hpa
  namespace: cicd-test
spec:
  maxReplicas: 10
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecom-webapp
  targetCPUUtilizationPercentage: 50
status:
  currentReplicas: 0
  desiredReplicas: 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: cicd-test
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: db-init
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          echo "Waiting for database..."
          until mysqladmin ping -h"${DB_HOST}" -u"${DB_USER}" -p"${DB_PASSWORD}" --silent; do
            sleep 2
          done

          echo "Running db-load-script.sql..."
          mysql -h"${DB_HOST}" \
                -u"${DB_USER}" \
                -p"${DB_PASSWORD}" \
                "${DB_NAME}" < /scripts/db-load-script.sql
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: app-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: app-config
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        name: db-init
        volumeMounts:
        - mountPath: /scripts/db-load-script.sql
          name: db-init-script
          readOnly: true
          subPath: db-load-script.sql
      restartPolicy: OnFailure
      volumes:
      - configMap:
          items:
          - key: db-load-script.sql
            path: db-load-script.sql
          name: db-init-cm
        name: db-init-script
