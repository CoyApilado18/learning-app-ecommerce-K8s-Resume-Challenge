name: Build and Deploy E-Commerce App

on:
  push:
    branches:
      - cicd-kustomize
  workflow_dispatch:

env:
  IMAGE_NAME: testyoc/ecom-web-cicd-test
  KUSTOMIZE_PATH: kubernetes/overlays/cicd-test
  KUBERNETES_NAMESPACE: cicd-test
  WEB_DEPLOYMENT_NAME: ecom-webapp
  DB_DEPLOYMENT_NAME: mysql

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to Local Kubernetes
    runs-on: [self-hosted, local-k8s]

    permissions:
      contents: read

    steps:
      - name: Check out repository # Check out the repository.
        uses: actions/checkout@v4

      - name: Verify runner tools and cluster access # Verify Docker, kubectl, and cluster access. `set -euo pipefail` is a safety guard: it stops the script on any error, treats unset variables as errors, and fails if a command in a pipeline fails.
        shell: bash
        run: |
          set -euo pipefail 
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"
          docker --version
          kubectl version --client
          kubectl get nodes
          kubectl config current-context

      - name: Create immutable image tag # Generate a commit-based image tag.
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub # Log in to Docker Hub using secrets.
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx # Set up Docker Buildx.                                
        uses: docker/setup-buildx-action@v4

      - name: Build and push application image # Build and push the Docker image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare Kustomize manifests with commit image tag # Copy Kustomize manifests to a temporary directory and replace the placeholder image tag with the commit-based tag.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kubernetes"
          cp -R kubernetes "$RUNNER_TEMP/kubernetes"
          sed -i \
            "s|newTag: placeholder|newTag: ${{ steps.image.outputs.tag }}|" \
            "$RUNNER_TEMP/$KUSTOMIZE_PATH/kustomization.yaml"

      - name: Render Kustomize manifests # Render the Kustomize output.
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize "$RUNNER_TEMP/$KUSTOMIZE_PATH" \
            > "$RUNNER_TEMP/cicd-test-rendered.yaml"
          grep -A2 -B2 "image: $IMAGE_NAME" \
            "$RUNNER_TEMP/cicd-test-rendered.yaml"

      - name: Validate manifests with Kubernetes API # Validate the rendered manifests against the Kubernetes API.
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server \
            -f "$RUNNER_TEMP/cicd-test-rendered.yaml"

      - name: Delete previous database initialization Job # Delete the previous database initialization Job if it exists, to ensure a clean state for the new deployment.
        shell: bash
        run: |
          set -euo pipefail
          kubectl delete job db-init-job \
            --namespace "$KUBERNETES_NAMESPACE" \
            --ignore-not-found=true

      - name: Apply cicd-test manifests # Apply the Kustomize manifests to the Kubernetes cluster.
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k "$RUNNER_TEMP/$KUSTOMIZE_PATH"

      - name: Wait for MySQL rollout # Wait for the MySQL deployment to rollout.
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/$DB_DEPLOYMENT_NAME \
            --namespace "$KUBERNETES_NAMESPACE" \
            --timeout=180s

      - name: Wait for web application rollout # Wait for the web application deployment to rollout.
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/$WEB_DEPLOYMENT_NAME \
            --namespace "$KUBERNETES_NAMESPACE" \
            --timeout=180s

      - name: Wait for database initialization Job # Wait for the database initialization Job to complete.
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait --for=condition=complete job/db-init-job \
            --namespace "$KUBERNETES_NAMESPACE" \
            --timeout=180s

      - name: Show deployment and storage status
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployments,pods,services,pvc -n "$KUBERNETES_NAMESPACE"
          kubectl get pv cicd-test-mysql-pv
          kubectl get deployment "$WEB_DEPLOYMENT_NAME" \
            --namespace "$KUBERNETES_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
