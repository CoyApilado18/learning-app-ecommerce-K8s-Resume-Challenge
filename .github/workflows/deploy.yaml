name: Build and Deploy E-Commerce App

on:
  push:
    branches:
      - k8s-ecomwebapp

  workflow_dispatch:

env:
  IMAGE_NAME: testyoc/ecom-web-helm-cicd-test
  DEPLOYMENT_NAME: ecom-webapp
  CONTAINER_NAME: ecom-webapp
  KUBERNETES_NAMESPACE: cicd-test

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to Local Kubernetes
    runs-on: [self-hosted, local-k8s]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner tools and cluster access
        run: |
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"
          docker --version
          kubectl version --client
          kubectl get nodes
          kubectl config current-context

      - name: Create immutable image tag
        id: image
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Kubernetes Deployment
        shell: bash
        run: |
          kubectl -n "${KUBERNETES_NAMESPACE}" set image \
            deployment/"${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}"="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Wait for Kubernetes rollout
        shell: bash
        run: |
          kubectl -n "${KUBERNETES_NAMESPACE}" rollout status \
            deployment/"${DEPLOYMENT_NAME}" \
            --timeout=180s

      - name: Show deployed image
        shell: bash
        run: |
          kubectl -n "${KUBERNETES_NAMESPACE}" get deployment "${DEPLOYMENT_NAME}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'