name: Build, Push and Update K8s Manifest

on:
  push:
    branches:
      - k8s-ecomwebapp
      - master

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ecom-web
  MANIFEST_PATH: kubernetes/ecomwebapp/01-website-deployment.yaml

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 3. Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 4. Update Kubernetes manifest with new image tag
      - name: Update K8s manifest with new image
        run: |
          NEW_IMAGE="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Updating manifest to image: $NEW_IMAGE"

          # Use sed to replace the image line in the deployment YAML
          # This assumes your YAML has a line like:
          #   image: some-old-image:tag
          # under spec.template.spec.containers
          sed -i "s|image: .*|image: ${NEW_IMAGE}|g" "${{ env.MANIFEST_PATH }}"

          # Show the diff for debugging
          git diff "${{ env.MANIFEST_PATH }}"

      # 5. Commit and push manifest change (GitOps-style)
      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.MANIFEST_PATH }}"

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "ci: update website image to ${{ github.sha }}"
            git push
          else
            echo "No manifest changes to commit"
          fi